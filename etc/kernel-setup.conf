# /etc/kernel-setup.conf
#
# Configuration for /usr/local/bin/uki-build.sh (pacman hook and manual runs).
#
# Format: a small TOML subset.
#   - One table, [uki]
#   - key = "string"   or   key = true / false
#   - '#' starts a comment, so never put a '#' inside a value
#   - Arrays are NOT supported; lists are comma-separated strings
#
# Every key is optional. A missing key uses the default shown in its comment.
# The features fallback, pcr_signing and secureboot are opt-in (default: off).

[uki]

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

# Directory where <pkgbase>.efi (and <pkgbase>-fallback.efi) are written.
# Must exist and should be on a single mounted filesystem (normally the ESP,
# or /boot if the ESP is mounted there). /etc/grub.d/11_uki also reads this
# setting to find the UKIs. The temporary <pkgbase>.new.efi is
# created here too, so the final rename is atomic.
# Default: "/boot"
outdir = "/boot"

# ---------------------------------------------------------------------------
# Fallback image
# ---------------------------------------------------------------------------

# true:  before replacing <pkgbase>.efi with an image of a DIFFERENT kernel
#        version, copy the old image to <pkgbase>-fallback.efi.
#        Rebuilds of the same version (microcode, dracut updates) never touch
#        the fallback, so it keeps holding the previous kernel.
# false: no fallback is created or updated (an existing one is left alone).
# Default: false
fallback = true

# ---------------------------------------------------------------------------
# TPM2 PCR signing (ukify)
# ---------------------------------------------------------------------------

# true:  dracut builds only the initramfs and ukify assembles the UKI and
#        signs the PCR 11 policy (one signature per phase below). Needed for
#        systemd-cryptenroll --tpm2-public-key unlocking.
#        If enabled and the keys or ukify are missing, the run aborts before
#        building, and existing images are left untouched.
# false: dracut builds the whole UKI with --uefi (no PCR signature).
# Create the keys and /etc/kernel/cmdline with: sudo uki-pcr-setup.sh
# Default: false
pcr_signing = false

# RSA public key embedded in the UKI; enroll LUKS slots against this key.
# Default: "/etc/systemd/tpm2-pcr-public-key.pem"
pcr_public_key = "/etc/systemd/tpm2-pcr-public-key.pem"

# RSA private key used to sign the PCR policies. Keep it root:root, mode 0600.
# Default: "/etc/systemd/tpm2-pcr-private-key.pem"
pcr_private_key = "/etc/systemd/tpm2-pcr-private-key.pem"

# Phase paths to sign, joined by commas (spaces are ignored). Each entry is one
# signed PCR 11 policy. Changing this changes the signed policies, so TPM
# slots enrolled against the old set may stop unlocking until re-enrolled.
# Only used when pcr_signing = true.
# Default: the four phases below
pcr_phases = "enter-initrd,enter-initrd:leave-initrd,enter-initrd:leave-initrd:sysinit,enter-initrd:leave-initrd:sysinit:ready"

# ---------------------------------------------------------------------------
# Secure Boot signing
# ---------------------------------------------------------------------------

# true:  sign the finished UKI for Secure Boot.
#        With pcr_signing = true, ukify signs while building.
#        With pcr_signing = false, the image is signed with sbsign
#        (package: sbsigntools) after dracut has built it.
#        If enabled and the key or certificate is missing, the run aborts
#        before building.
# false: leave the UKI unsigned for Secure Boot.
# Default: false
secureboot = false

# Signing key and certificate (the defaults are sbctl's "db" key pair).
# Default: "/var/lib/sbctl/keys/db/db.key"
secureboot_private_key = "/var/lib/sbctl/keys/db/db.key"
# Default: "/var/lib/sbctl/keys/db/db.pem"
secureboot_certificate = "/var/lib/sbctl/keys/db/db.pem"

# ---------------------------------------------------------------------------
# GRUB
# ---------------------------------------------------------------------------

# true:  run grub-mkconfig after at least one UKI was built. The UKI menu
#        entries are generated by /etc/grub.d/11_uki, which reads outdir
#        from this file and adds one entry per <pkgbase>.efi and
#        <pkgbase>-fallback.efi found there.
# false: never run grub-mkconfig from this script (you can still run it by
#        hand, and 11_uki is still used then).
# Default: false
grub_mkconfig = false

# Where grub-mkconfig writes its output.
# Default: "/boot/grub/grub.cfg"
grub_cfg = "/boot/grub/grub.cfg"

# ---------------------------------------------------------------------------
# Extra rebuild triggers
# ---------------------------------------------------------------------------

# Extra patterns that force a rebuild of ALL UKIs, appended to the built-in
# list (dracut, systemd, systemd-ukify, btrfs-progs, e2fsprogs, dosfstools,
# amd-ucode, intel-ucode, linux-firmware, grub).
# Comma-separated; each entry is a package name or a file path WITHOUT a
# leading slash; globs are allowed.
# The pacman hook must also list a matching Target line (Type = Package for
# names, Type = Path for paths), otherwise the script is never called for it.
# Manual runs always rebuild everything and ignore this setting.
# Default: "" (none)
trigger_patterns = ""